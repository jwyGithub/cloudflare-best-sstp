name: docker-publish

# 打包发布：复用根目录 Dockerfile 构建多架构镜像（amd64 + arm64），
# 推送到 GitHub Container Registry (GHCR)。不重复造轮子——
# 构建逻辑只有 Dockerfile 一处来源，CI 与本地 compose 完全一致。
#
# 触发：
#   - push tag v*（例如 v0.0.1）-> 发布语义化版本 :0.0.1 / :0.0，
#                                  并同步更新 :latest 与 :sha-xxxxxxx
#   - 手动 workflow_dispatch

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 镜像名必须全小写；由 owner/repo 动态推导，避免大小写不一致导致推送失败。
      - name: Compute lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 层缓存，显著加速重复构建（高性能）。
          cache-from: type=gha
          cache-to: type=gha,mode=max
