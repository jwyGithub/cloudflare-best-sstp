name: scheduled-run

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run SSTP check
        env:
          SSTP_PASSWORD: ${{ secrets.SSTP_PASSWORD }}
          SSTP_SERVER_HOST: ${{ vars.SSTP_SERVER_HOST }}
          SSTP_LIST_URL: ${{ vars.SSTP_LIST_URL }}
          SSTP_OUTPUT_TEMPLATE: ${{ vars.SSTP_OUTPUT_TEMPLATE }}
        run: cargo run --quiet --release --locked > sstp.txt.tmp

      - name: Preserve the previous result when no nodes are available
        run: |
          if [ ! -s sstp.txt.tmp ]; then
            rm sstp.txt.tmp
            echo "No nodes returned; keeping the existing sstp.txt"
            exit 0
          fi
          mv sstp.txt.tmp sstp.txt

      - name: Commit result
        run: |
          if git diff --quiet -- sstp.txt; then
            echo "sstp.txt is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sstp.txt
          git commit -m "chore: update SSTP nodes"
          git push
