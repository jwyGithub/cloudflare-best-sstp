[package]
name = "cloudflare-best-sstp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Check SSTP node connectivity and print available nodes for GitHub Actions"
license = "MIT"
repository = "https://github.com/jwyGithub/cloudflare-best-sstp"
readme = "README.md"

[[bin]]
name = "cloudflare-best-sstp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "brotli",
    "charset",
    "http2",
] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
